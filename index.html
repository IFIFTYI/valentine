<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💘</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, pink, #ffb6c1);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.box {
  text-align: center;
}

h1 {
  font-size: 42px;
  margin-bottom: 20px;
}

button {
  font-size: 20px;
  padding: 15px 30px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
}

#yes {
  background: #ff4d6d;
  color: white;
  margin-right: 20px;
}

#no {
  background: #555;
  color: white;
  position: absolute;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

<div id="app">
  <div class="box">
    <h1>💖 Will you be my Valentine Ayacita? 💖</h1>

    <p id="no-counter" style="font-size:18px; color:#333;">
      Number of NO attempts: 0 😈
    </p>

    <button id="yes">Yes 💘</button>
    <button id="no">No 💔</button>
  </div>
</div>

<audio id="escapeSound" src="NOPE.mp3"></audio>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const escapeSound = document.getElementById("escapeSound");
const counter = document.getElementById("no-counter");

let noCount = 0;
let yesChasing = false;

/* فتح إذن الصوت */
document.body.addEventListener("click", () => {
  escapeSound.play().then(() => {
    escapeSound.pause();
    escapeSound.currentTime = 0;
  }).catch(()=>{});
}, { once: true });

function moveNo() {
  const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
  const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  escapeSound.currentTime = 0;
  escapeSound.play().catch(()=>{});

  noCount++;
  counter.textContent = `Number of NO attempts: ${noCount} 😈`;

  if (noCount >= 6) {
    yesChasing = true;
  }
}

noBtn.addEventListener("mouseenter", moveNo);
noBtn.addEventListener("touchstart", (e) => {
  e.preventDefault();
  moveNo();
});

/* YES يلاحق الماوس 😈 */
document.addEventListener("mousemove", (e) => {
  if (!yesChasing) return;

  const rect = yesBtn.getBoundingClientRect();
  yesBtn.style.position = "absolute";
  yesBtn.style.left = (e.clientX - rect.width / 2) + "px";
  yesBtn.style.top = (e.clientY - rect.height / 2) + "px";
});

/* YES action */
yesBtn.addEventListener("click", () => {

  confetti({
    particleCount: 200,
    spread: 100,
    origin: { y: 0.6 }
  });

  document.getElementById("app").innerHTML = `
    <div style="
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:white;
      font-family:Arial;
    ">
      <h1>🎂 Happy Birthday ❤️</h1>
      <p id="typing-text" style="
        font-size:20px;
        margin-top:20px;
        white-space:pre-line;
        max-width:80%;
      "></p>
    </div>
  `;

  const text = \`Happy Birthday 🎂❤️
I hope this year brings you
as much happiness
as you bring into my life ✨\`;

  let i = 0;
  const typingEl = document.getElementById("typing-text");

  const typing = setInterval(() => {
    typingEl.textContent += text.charAt(i);
    i++;
    if (i >= text.length) clearInterval(typing);
  }, 60);
});
</script>

</body>
</html>
