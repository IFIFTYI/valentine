<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💘</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, pink, #ffb6c1);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.box {
  text-align: center;
  position: relative;
}

h1 {
  font-size: 36px;
  margin-bottom: 15px;
}

button {
  font-size: 18px;
  padding: 14px 28px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  pointer-events: auto;
}

#yes {
  background: #ff4d6d;
  color: white;
  margin-right: 15px;
  z-index: 10;      /* أعلى */
  position: relative;
}

#no {
  background: #555;
  color: white;
  position: absolute;
  z-index: 5;       /* أقل من YES */
}

#playMusic {
  margin-top: 15px;
  background: #fff;
  color: #ff4d6d;
  padding: 10px 22px;
  border-radius: 20px;
  border: none;
  font-size: 15px;
  z-index: 1;
  position: relative;
}

.main-img {
  width: 90%;
  max-width: 420px;
  margin-bottom: 15px;
}

.slideshow-img {
  width: 90%;
  max-width: 450px;
  margin-top: 20px;
  border-radius: 16px;
  transition: opacity 0.5s ease;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

<!-- الأصوات -->
<audio id="noSound" src="NOPE.mp3"></audio>
<audio id="song" src="song.mp3" loop></audio>

<div id="app">
  <div class="box">
    <h1>💖 Will you be my Valentine Ayacita? 💖</h1>
    <img src="first.jpg" class="main-img">

    <p id="counter">NO attempts: 0 😈</p>

    <button id="yes">Yes 💘</button>
    <button id="no">No 💔</button>

    <br>

    
  </div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const playMusicBtn = document.getElementById("playMusic");

const noSound = document.getElementById("noSound");
const song = document.getElementById("song");
const counter = document.getElementById("counter");

let noCount = 0;
let yesChasing = false;
let audioUnlocked = false;

/* فتح إذن الصوت */
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;

  noSound.play().then(() => {
    noSound.pause();
    noSound.currentTime = 0;
  }).catch(()=>{});

  song.play().then(() => {
    song.pause();
    song.currentTime = 0;
  }).catch(()=>{});
}

document.body.addEventListener("click", unlockAudio, { once: true });

/* زر تشغيل الموسيقى */
playMusicBtn.addEventListener("click", () => {
  unlockAudio();
  song.currentTime = 0;
  song.play().catch(()=>{});
  playMusicBtn.textContent = "🎵 Playing...";
});

/* حركة زر NO */
function moveNo() {
  unlockAudio();

  const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
  const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  noSound.currentTime = 0;
  noSound.play().catch(()=>{});

  noCount++;
  counter.textContent = `NO attempts: ${noCount} 😈`;

  const size = parseFloat(getComputedStyle(yesBtn).fontSize);
  yesBtn.style.fontSize = (size + 2) + "px";

  if (noCount >= 6) yesChasing = true;
}

noBtn.addEventListener("mouseenter", moveNo);
noBtn.addEventListener("touchstart", e => {
  e.preventDefault();
  moveNo();
});

/* YES يلاحق الماوس */
document.addEventListener("mousemove", e => {
  if (!yesChasing) return;
  const r = yesBtn.getBoundingClientRect();
  yesBtn.style.position = "absolute";
  yesBtn.style.left = (e.clientX - r.width / 2) + "px";
  yesBtn.style.top = (e.clientY - r.height / 2) + "px";
});

/* YES */
yesBtn.addEventListener("click", () => {

  /* إيقاف الموسيقى وإخفاء زرها */
  song.pause();
  song.currentTime = 0;

  confetti({
    particleCount: 200,
    spread: 100,
    origin: { y: 0.6 }
  });

yesBtn.addEventListener("click", () => {

  /* شغّل الأغنية فورًا */
  song.currentTime = 0;
  song.play().catch(()=>{});

  /* بعد 200ms نكمل الأكشن */
  setTimeout(() => {

    confetti({
      particleCount: 200,
      spread: 100,
      origin: { y: 0.6 }
    });

    document.getElementById("app").innerHTML = `
      <div style="
        width:100%;
        height:100%;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        color:white;
        text-align:center;
      ">
        <h1>🎂 Happy Birthday ❤️</h1>
        <p id="typing" style="
          white-space:pre-line;
          font-size:18px;
          max-width:80%;
        "></p>
        <img id="slide" src="img1.jpg" class="slideshow-img">
      </div>
    `;

    /* Typing effect */
    const text = `Happy Birthday 🎂❤️
I hope this year brings you
as much happiness
as you bring into my life ✨`;

    let i = 0;
    const typingEl = document.getElementById("typing");
    const typer = setInterval(() => {
      typingEl.textContent += text.charAt(i);
      i++;
      if (i >= text.length) clearInterval(typer);
    }, 60);

    /* Slideshow */
    const images = ["img1.jpg","img2.jpg","img3.jpg","img4.jpg"];
    let idx = 0;
    const img = document.getElementById("slide");

    setInterval(() => {
      img.style.opacity = 0;
      setTimeout(() => {
        idx = (idx + 1) % images.length;
        img.src = images[idx];
        img.style.opacity = 1;
      }, 400);
    }, 2500);

  }, 200); // 👈 السر هنا
});

</script>

</body>
</html>
