<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💘</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, pink, #ffb6c1);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* container كبير لكن مش بياخد clicks */
#app {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  pointer-events: none;
}

.box {
  text-align: center;
  position: relative;
  pointer-events: auto; /* 🔴 مهم */
}

h1 {
  font-size: 36px;
  margin-bottom: 15px;
}

button {
  font-size: 18px;
  padding: 14px 28px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  pointer-events: auto;
}

#yes {
  background: #ff4d6d;
  color: white;
  margin-right: 15px;
  position: relative;
  z-index: 10;
}

#no {
  background: #555;
  color: white;
  position: absolute;
  z-index: 9;
}
</style>
</head>

<body>

<div id="app">
  <div class="box">
    <h1>💖 Will you be my Valentine Ayacita? 💖</h1>

    <p id="counter">NO attempts: 0 😈</p>

    <button id="yes">Yes 💘</button>
    <button id="no">No 💔</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const counter = document.getElementById("counter");

let noCount = 0;

/* حركة زر NO */
function moveNo() {
  const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
  const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  noCount++;
  counter.textContent = `NO attempts: ${noCount} 😈`;
}

/* الأحداث */
noBtn.addEventListener("mouseenter", moveNo);
noBtn.addEventListener("touchstart", (e) => {
  e.preventDefault();
  moveNo();
});

yesBtn.addEventListener("click", () => {
  alert("YES CLICKED 💖");
});
</script>

</body>
</html>
