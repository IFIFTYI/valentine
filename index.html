<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💘</title>

<style>
  .yes-img {
  width: 120%;
  max-width: 450px;
  height: auto;
  margin: 20px 0;
}
  .main-img {
  width: 120%;
  max-width: 420px;
  height: auto;
  margin-bottom: 20px;
}
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, pink, #ffb6c1);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.box {
  text-align: center;
}

h1 {
  font-size: 42px;
  margin-bottom: 20px;
}

button {
  font-size: 20px;
  padding: 15px 30px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
}

#yes {
  background: #ff4d6d;
  color: white;
  margin-right: 20px;
}

#no {
  background: #555;
  color: white;
  position: absolute;
}
</style>
</head>

<body>

<div class="box">
  <h1>💖 Will you be my Valentine ayacita? 💖</h1>

<img src="first.jpg" class="main-img"><br><br>

  <button id="yes" onclick="yesClicked()">Yes 💘</button>
  <button id="no">No 💔</button>
</div>

<!-- 🔊 صوت الهروب -->
<audio id="escapeSound" preload="auto">
  <source src="NOPE.mp3" type="audio/mpeg">
</audio>

<script>
const noBtn = document.getElementById("no");
const sound = document.getElementById("escapeSound");

// حركة الهروب + الصوت
function moveButton() {
  const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
  const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  sound.currentTime = 0;
  sound.play().catch(()=>{});
}

// ماوس
noBtn.addEventListener("mouseover", moveButton);

// موبايل
noBtn.addEventListener("touchstart", function(e) {
  e.preventDefault();
  moveButton();
});

// أكشن YES 💘
function yesClicked() {
  document.body.innerHTML = `
    <div style="
      height:100vh;
      background:linear-gradient(135deg,#ff4d6d,#ff9aa2);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      color:white;
      font-family:Arial;
      text-align:center;
    ">
      <h1>💕 Yay! I knew it! 💕</h1>
      <p style="font-size:22px;">Happy Valentine 💘</p>
      <img src="yes.jpg" class="yes-img">
    </div>
  `;
}
</script>

</body>
</html>
