<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💘</title>

<style>
  .yes-img {
  width: 120%;
  max-width: 450px;
  height: auto;
  margin: 20px 0;
}
  .main-img {
  width: 120%;
  max-width: 420px;
  height: auto;
  margin-bottom: 20px;
}
  .main-img,
.yes-img {
  transition: transform 0.3s ease;
}

.main-img:hover,
.yes-img:hover {
  transform: scale(1.05);
}
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, pink, #ffb6c1);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.box {
  text-align: center;
}

h1 {
  font-size: 42px;
  margin-bottom: 20px;
}

button {
  font-size: 20px;
  padding: 15px 30px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
}

#yes {
  background: #ff4d6d;
  color: white;
  margin-right: 20px;
}

#no {
  background: #555;
  color: white;
  position: absolute;
}
</style>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

<div class="box">
  <h1>💖 Will you be my Valentine ayacita? 💖</h1>

<img src="first.jpg" class="main-img"><br><br>
<p id="no-counter" style="font-size:18px; color:#333;">
  Number of NO attempts: 0 😈
</p>

  <button id="yes" onclick="yesClicked()">Yes 💘</button>
  <button id="no">No 💔</button>
</div>

<!-- 🔊 صوت الهروب -->
<audio id="escapeSound" preload="auto">
  <source src="NOPE.mp3" type="audio/mpeg">
</audio>

<script>
const noBtn = document.getElementById("no");
const sound = document.getElementById("escapeSound");
let noCount = 0;
// حركة الهروب + الصوت
function moveButton() {
  const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
  const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  sound.currentTime = 0;
  sound.play().catch(()=>{});
  noCount++;
document.getElementById("no-counter").innerText =
  `Number of NO attempts: ${noCount} 😈`;
  const currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
yesBtn.style.fontSize = (currentSize + 2) + "px";
}
  

// ماوس
noBtn.addEventListener("mouseover", moveButton);

// موبايل
noBtn.addEventListener("touchstart", function(e) {
  e.preventDefault();
  moveButton();
});
confetti({
  particleCount: 150,
  spread: 90,
  origin: { y: 0.6 }
});
// أكشن YES 💘
yesBtn.addEventListener("click", () => {

  alert("💖 I knew you would say YES, Ayacita 💖");

  confetti({
    particleCount: 150,
    spread: 90,
    origin: { y: 0.6 }
  });

  document.body.innerHTML = `
    <div style="
      width:100%;
      height:100%;
      background:linear-gradient(135deg,#ff4d6d,#ff9aa2);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      color:white;
      font-family:Arial;
      text-align:center;
    ">
      <h1>💕 Yay! I knew it! 💕</h1>
      <img src="yes.jpg" class="yes-img">
      <p style="font-size:22px;">Happy Valentine 💘</p>
    </div>
  `;
});
</script>

</body>
</html>
