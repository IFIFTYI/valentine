<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💘</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, pink, #ffb6c1);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.box {
  text-align: center;
}

h1 {
  font-size: 42px;
  margin-bottom: 20px;
}

button {
  font-size: 20px;
  padding: 15px 30px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
}

#yes {
  background: #ff4d6d;
  color: white;
  margin-right: 20px;
}

#no {
  background: #555;
  color: white;
  position: absolute;
}

.main-img {
  width: 90%;
  max-width: 420px;
  height: auto;
  margin-bottom: 20px;
}

.slideshow-img {
  width: 90%;
  max-width: 450px;
  height: auto;
  margin: 20px 0;
  border-radius: 16px;
  transition: opacity 0.5s ease;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

<div class="box">
  <h1>💖 Will you be my Valentine Ayacita? 💖</h1>
  <img src="first.jpg" class="main-img">

  <p id="no-counter" style="font-size:18px; color:#333;">
    Number of NO attempts: 0 😈
  </p>

  <button id="yes">Yes 💘</button>
  <button id="no">No 💔</button>
</div>

<!-- الأصوات -->
<audio id="escapeSound" src="NOPE.mp3"></audio>
<audio id="song" src="song.mp3" loop></audio>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const escapeSound = document.getElementById("escapeSound");
const song = document.getElementById("song");

let noCount = 0;
let audioUnlocked = false;

/* 🔓 فتح إذن الصوت مرة واحدة */
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;

  escapeSound.play().then(() => {
    escapeSound.pause();
    escapeSound.currentTime = 0;
  }).catch(()=>{});

  song.play().then(() => {
    song.pause();
    song.currentTime = 0;
  }).catch(()=>{});
}

document.body.addEventListener("click", unlockAudio, { once: true });

/* حركة زر NO */
function moveNo() {
  unlockAudio();

  const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
  const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  escapeSound.currentTime = 0;
  escapeSound.play().catch(()=>{});

  noCount++;
  document.getElementById("no-counter").innerText =
    `Number of NO attempts: ${noCount} 😈`;

  const currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
  yesBtn.style.fontSize = (currentSize + 2) + "px";
}

noBtn.addEventListener("mouseenter", moveNo);
noBtn.addEventListener("touchstart", (e) => {
  e.preventDefault();
  moveNo();
});

/* YES */
yesBtn.addEventListener("click", () => {
  unlockAudio();

  song.currentTime = 0;
  song.play().catch(()=>{});

  confetti({
    particleCount: 180,
    spread: 100,
    origin: { y: 0.6 }
  });

  document.body.innerHTML = `
    <div style="
      width:100%;
      height:100%;
      background:linear-gradient(135deg,#ff4d6d,#ff9aa2);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      color:white;
      font-family:Arial;
      text-align:center;
    ">
      <h1>💕 Our Memories 💕</h1>
      <p style="font-size:20px;">I knew it from the start 💘</p>
      <img id="slideshow" src="img1.jpg" class="slideshow-img">
    </div>
  `;

  const images = ["img1.jpg","img2.jpg","img3.jpg","img4.jpg"];
  let index = 0;
  const img = document.getElementById("slideshow");

  setInterval(() => {
    img.style.opacity = 0;
    setTimeout(() => {
      index = (index + 1) % images.length;
      img.src = images[index];
      img.style.opacity = 1;
    }, 500);
  }, 2500);
});
</script>

</body>
</html>
